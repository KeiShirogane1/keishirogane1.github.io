<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Opening QwerNFC</title>
<script>
(() => {
  const target = new URL("https://qwernfc-api.qwernfc-api.workers.dev/update-v2/");
  const source = new URL(window.location.href);
  for (const [key, value] of source.searchParams) target.searchParams.set(key, value);
  if (!target.searchParams.has("v")) target.searchParams.set("v", String(Date.now()));
  window.location.replace(target.href);
})();
</script>
</head><body><p>Opening QwerNFC…</p></body></html>
