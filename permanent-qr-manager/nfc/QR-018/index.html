<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>Opening destination</title><style>body{margin:0;background:#06110a;color:#e9fff0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,560px);padding:28px;border:1px solid #1d5b32;border-radius:20px;background:#0a1b10}p{line-height:1.55;color:#b9d8c2}a{color:#7de39c}code{color:#d8ffe3}</style></head>
<body><main><small>QwerNFC PERMANENT ROUTER</small><h1 id="title">Opening destination</h1><p><code>QR-018</code></p><p id="status">Resolving the latest NFC destination…</p><p><a id="link" hidden rel="noreferrer noopener">Continue</a></p></main>
<script>
(()=>{const expectedId="QR-018",routeKind="NFC",routeApiSrc="https://api.github.com/repos/KeiShirogane1/keishirogane1.github.io/contents/permanent-qr-manager/nfc/QR-018/route.json?ref=bbmain",routeRawSrc="https://raw.githubusercontent.com/KeiShirogane1/keishirogane1.github.io/bbmain/permanent-qr-manager/nfc/QR-018/route.json",fallbackApiSrc="https://api.github.com/repos/KeiShirogane1/keishirogane1.github.io/contents/permanent-qr-manager/nfc/QR-018/fallback.json?ref=bbmain",fallbackRawSrc="https://raw.githubusercontent.com/KeiShirogane1/keishirogane1.github.io/bbmain/permanent-qr-manager/nfc/QR-018/fallback.json",routeLocalSrc="./route.json",fallbackLocalSrc="./fallback.json";
const title=document.getElementById("title"),status=document.getElementById("status"),link=document.getElementById("link"),show=(h,m)=>{title.textContent=h;status.textContent=m};
const fresh=(src)=>src+(src.includes("?")?"&":"?")+"v="+Date.now(),fetchWithTimeout=async(src,options={})=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);try{return await fetch(src,{...options,signal:controller.signal})}finally{clearTimeout(timer)}},fetchJson=async(src)=>{const response=await fetchWithTimeout(fresh(src),{cache:"no-store",mode:"cors"});if(!response.ok)throw new Error("route");return response.json()},fromApi=async(src)=>{const response=await fetchWithTimeout(fresh(src),{cache:"no-store",mode:"cors"});if(!response.ok)throw new Error("api");const payload=await response.json();if(!payload||typeof payload.content!=="string")throw new Error("api-content");const binary=atob(payload.content.replace(/\s/g,""));const bytes=Uint8Array.from(binary,(char)=>char.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))},newest=(routes)=>routes.filter(Boolean).sort((a,b)=>{const d=Number(b.linkVersion||0)-Number(a.linkVersion||0);if(d)return d;return String(b.updatedAt||b.linkChangedAt||"").localeCompare(String(a.updatedAt||a.linkChangedAt||""))})[0]||null;
const resolve=async()=>{try{const local=await fetchJson(routeLocalSrc);if(local&&String(local.id||"").toUpperCase()===expectedId)return{route:{...local,destination:String(local.destination||"").trim()},failback:false}}catch{}const githubCurrent=await Promise.allSettled([fetchJson(routeRawSrc),fromApi(routeApiSrc)]);const githubRoute=newest(githubCurrent.filter(x=>x.status==="fulfilled").map(x=>x.value).filter(x=>x&&String(x.id||"").toUpperCase()===expectedId));if(githubRoute)return{route:{...githubRoute,destination:String(githubRoute.destination||"").trim()},failback:false};try{const localFallback=await fetchJson(fallbackLocalSrc);if(localFallback&&String(localFallback.id||"").toUpperCase()===expectedId)return{route:{id:expectedId,kind:routeKind,enabled:localFallback.enabled===true,deleted:localFallback.deleted===true,destination:String(localFallback.fallbackDestination||""),fallbackDestination:String(localFallback.fallbackDestination||""),updatedAt:String(localFallback.updatedAt||"")},failback:true}}catch{}const fb=await Promise.allSettled([fetchJson(fallbackRawSrc),fromApi(fallbackApiSrc)]);const fs=newest(fb.filter(x=>x.status==="fulfilled").map(x=>x.value).filter(x=>x&&String(x.id||"").toUpperCase()===expectedId));if(fs)return{route:{id:expectedId,kind:routeKind,enabled:fs.enabled===true,deleted:fs.deleted===true,destination:String(fs.fallbackDestination||""),fallbackDestination:String(fs.fallbackDestination||""),updatedAt:String(fs.updatedAt||"")},failback:true};throw new Error("route")};
const legacyResolve=()=>resolve().then(({route,failback})=>{if(!route||String(route.id||"").toUpperCase()!==expectedId)return show("Route unavailable","The latest destination could not be verified.");if(route.deleted===true||route.enabled!==true)return show("Permanent NFC inactive","This permanent QwerNFC route has been disabled.");const destination=String(route.destination||"").trim();if(!destination)return show(failback?"Failback unavailable":"Destination not configured",failback?"The live route is unavailable and no emergency fallback destination is configured.":"This permanent QwerNFC route does not have a destination yet.");let target;try{target=new URL(destination);if(!["http:","https:"].includes(target.protocol))throw new Error("scheme")}catch{return show("Invalid destination","The saved destination is not a valid web address.")}link.href=target.href;link.hidden=false;window.location.replace(target.href)}).catch(()=>show("Route unavailable","Could not load the live route or its emergency fallback destination."));
// Prefer the QwerNFC resolver; use the previous GitHub router as emergency
// fallback if QwerNFC is unavailable. Neither path rewrites permanent values.
const qwerResolverUrl="https://qwernfc-api.qwernfc-api.workers.dev/nfc/QR-018/";
fetchWithTimeout(fresh(qwerResolverUrl+"?probe=1"),{cache:"no-store",mode:"cors"}).then((response)=>{
  if(response.status===204&&response.headers.get("x-qwernfc-resolver")==="ready"){
    window.location.replace(fresh(qwerResolverUrl));
  }else{
    legacyResolve();
  }
}).catch(()=>legacyResolve())})();
</script></body></html>
