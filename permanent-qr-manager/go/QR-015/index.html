<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>Opening destination</title><style>body{margin:0;background:#06110a;color:#e9fff0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,560px);padding:28px;border:1px solid #1d5b32;border-radius:20px;background:#0a1b10}p{line-height:1.55;color:#b9d8c2}a{color:#7de39c}code{color:#d8ffe3}</style></head><body><main><small>QwerNFC PERMANENT ROUTER</small><h1 id="title">Opening destination</h1><p><code>QR-015</code></p><p id="status">Resolving latest QR destination…</p><p><a id="link" hidden rel="noreferrer noopener">Continue</a></p></main><script>(()=>{const id="QR-015",kind="QR",api="https://api.github.com/repos/KeiShirogane1/keishirogane1.github.io/contents/permanent-qr-manager/go/QR-015/route.json?ref=bbmain",raw="https://raw.githubusercontent.com/KeiShirogane1/keishirogane1.github.io/bbmain/permanent-qr-manager/go/QR-015/route.json",fa="https://api.github.com/repos/KeiShirogane1/keishirogane1.github.io/contents/permanent-qr-manager/go/QR-015/fallback.json?ref=bbmain",fr="https://raw.githubusercontent.com/KeiShirogane1/keishirogane1.github.io/bbmain/permanent-qr-manager/go/QR-015/fallback.json",title=document.getElementById("title"),status=document.getElementById("status"),link=document.getElementById("link");const show=(h,m)=>{title.textContent=h;status.textContent=m},fresh=u=>u+(u.includes("?")?"&":"?")+"t="+Date.now(),get=async u=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),2500);try{const r=await fetch(fresh(u),{cache:"no-store",mode:"cors",signal:c.signal});if(!r.ok)throw new Error("fetch");return r.json()}finally{clearTimeout(tm)}},apiGet=async u=>{const p=await get(u);if(!p||typeof p.content!=="string")throw new Error("api");const bin=atob(p.content.replace(/\s/g,""));return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))))},newest=a=>a.filter(Boolean).sort((x,y)=>Number(y.linkVersion||0)-Number(x.linkVersion||0)||String(y.updatedAt||y.linkChangedAt||"").localeCompare(String(x.updatedAt||x.linkChangedAt||"")))[0]||null,valid=x=>x&&String(x.id||"").toUpperCase()===id;const current=async()=>{const r=await Promise.allSettled([get("./route.json"),get(raw),apiGet(api)]);return newest(r.filter(x=>x.status==="fulfilled").map(x=>x.value).filter(valid))},fallback=async()=>{const r=await Promise.allSettled([get("./fallback.json"),get(fr),apiGet(fa)]),f=newest(r.filter(x=>x.status==="fulfilled").map(x=>x.value).filter(valid));return f?{id,kind,enabled:f.enabled===true,deleted:f.deleted===true,destination:String(f.fallbackDestination||""),updatedAt:String(f.updatedAt||"")}:null};(async()=>{let route=await current(),usedFallback=false;if(!route){route=await fallback();usedFallback=true}if(!route)return show("Route unavailable","The latest destination could not be verified.");if(route.deleted===true||route.enabled!==true)return show("Permanent QR inactive","This permanent QwerNFC route has been disabled.");const d=String(route.destination||"").trim();if(!d)return show(usedFallback?"Failback unavailable":"Destination not configured",usedFallback?"No emergency fallback destination is configured.":"This permanent QwerNFC route does not have a destination yet.");let target;try{target=new URL(d);if(!["http:","https:"].includes(target.protocol))throw new Error("scheme")}catch{return show("Invalid destination","The saved destination is not a valid web address.")}link.href=target.href;link.hidden=false;window.location.replace(target.href)})().catch(()=>show("Route unavailable","Could not load the current GitHub route."))})();</script></body></html>
