<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0" />
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="expires" content="0" />
<title>Opening destination</title>
<style>body{margin:0;background:#06110a;color:#e9fff0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,560px);padding:28px;border:1px solid #1d5b32;border-radius:20px;background:#0a1b10}p{line-height:1.55;color:#b9d8c2}a{color:#7de39c}code{color:#d8ffe3}</style>
</head>
<body>
<main>
<small>QwerNFC PERMANENT ROUTER</small>
<h1 id="route-title">Opening destination</h1>
<p><code>QR-002</code></p>
<p id="route-status">Resolving the latest QR destination…</p>
<p><a id="route-link" hidden rel="noreferrer noopener">Continue to destination</a></p>
</main>
<script>
(() => {
  const title = document.getElementById("route-title");
  const status = document.getElementById("route-status");
  const link = document.getElementById("route-link");
  const show = (heading, message) => { title.textContent = heading; status.textContent = message; };
  const rawSrc = "https://raw.githubusercontent.com/KeiShirogane1/keishirogane1.github.io/bbmain/permanent-qr-manager/go/QR-002/route.json";
  const apiSrc = "https://api.github.com/repos/KeiShirogane1/keishirogane1.github.io/contents/permanent-qr-manager/go/QR-002/route.json?ref=bbmain";
  const fresh = (src) => src + (src.includes("?") ? "&" : "?") + "v=" + Date.now();

  const decodeApiRoute = async (response) => {
    if (!response.ok) throw new Error("Route API fetch failed");
    const payload = await response.json();
    if (!payload || typeof payload.content !== "string") throw new Error("Route API content missing");
    const binary = atob(payload.content.replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  };

  const fetchJson = async (src) => {
    const response = await fetch(fresh(src), { cache: "no-store", mode: "cors" });
    if (!response.ok) throw new Error("Route fetch failed");
    return response.json();
  };

  const newest = (routes) => routes
    .filter(Boolean)
    .sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")))[0] || null;

  const resolveLatest = async () => {
    if (apiSrc) {
      try {
        return await decodeApiRoute(await fetch(fresh(apiSrc), { cache: "no-store", mode: "cors" }));
      } catch {
        // Public GitHub API can rate-limit anonymous clients; fall through to CDN/Page sources.
      }
    }

    const localSrc = "./route.json";
    const results = await Promise.allSettled([
      fetchJson(rawSrc),
      fetchJson(localSrc)
    ]);
    const routes = results
      .filter((result) => result.status === "fulfilled")
      .map((result) => result.value);
    const route = newest(routes);
    if (!route) throw new Error("Route fetch failed");
    return route;
  };

  resolveLatest()
    .then((route) => {
      if (!route || route.id !== "QR-002") {
        show("Route unavailable", "The latest destination could not be verified.");
        return;
      }
      if (route.deleted || route.enabled !== true) {
        show("Permanent QR inactive", "This permanent QR has been disabled.");
        return;
      }
      if (!route.destination) {
        show("Destination not configured", "This permanent QR does not have a destination yet.");
        return;
      }

      try {
        const target = new URL(route.destination);
        if (!["http:", "https:"].includes(target.protocol)) throw new Error("Unsupported URL");
        link.href = target.href;
        link.hidden = false;
        window.location.replace(target.href);
      } catch {
        show("Invalid destination", "The saved destination is not a valid web address.");
      }
    })
    .catch(() => {
      show("Route unavailable", "Could not load the latest destination. Check your connection and try again.");
    });
})();
</script>
</body>
</html>
