<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0"><title>Opening destination</title><style>body{margin:0;background:#06110a;color:#e9fff0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,560px);padding:28px;border:1px solid #1d5b32;border-radius:20px;background:#0a1b10}p{color:#b9d8c2}a{color:#7de39c}</style></head>
<body><main><small>QwerNFC PERMANENT ROUTER</small><h1 id="title">Opening destination</h1><p><code>QR-004</code></p><p id="status">Resolving the latest QR destination…</p><p><a id="link" hidden rel="noreferrer noopener">Continue</a></p></main>
<script>(()=>{const id="QR-004",kind="QR";const title=document.getElementById("title"),status=document.getElementById("status"),link=document.getElementById("link");fetch("https://qwernfc-f8bf4-default-rtdb.asia-southeast1.firebasedatabase.app/public/routes/"+encodeURIComponent(id)+".json?v="+Date.now(),{cache:"no-store",mode:"cors"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(route=>{if(!route||route.id!==id)throw 0;if(route.deleted===true||route.enabled!==true){title.textContent="Permanent QR inactive";status.textContent="This permanent QwerNFC route has been disabled.";return}const value=kind==="NFC"?String(route.nfcDestination||""):String(route.qrDestination||"");if(!value){title.textContent="Destination not configured";status.textContent="This permanent QwerNFC route does not have a destination yet.";return}const target=new URL(value);if(!["http:","https:"].includes(target.protocol))throw 0;link.href=target.href;link.hidden=false;location.replace(target.href)}).catch(()=>{title.textContent="Route unavailable";status.textContent="Could not verify the latest destination. Try again."})})();</script></body></html>
