<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="cache-control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Opening QwerNFC</title>
<script>
(() => {
  const match = window.location.pathname.match(/\/recover\/(QR-\d+)\/?$/i);
  const id = String(match?.[1] || "").toUpperCase();
  const target = new URL("https://qwernfc-api.qwernfc-api.workers.dev/update-v2/");
  if (id) target.searchParams.set("id", id);
  target.searchParams.set("v", String(Date.now()));
  window.location.replace(target.href);
})();
</script>
</head><body><p>Opening QwerNFC…</p></body></html>
