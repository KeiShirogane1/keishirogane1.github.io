<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="cache-control" content="no-store,no-cache,max-age=0">
<title>QwerNFC scan forwarding</title>
<style>body{margin:0;padding:20px;box-sizing:border-box;min-height:100dvh;display:grid;place-items:center;background:#03130a;color:#eafbef;font:15px system-ui,sans-serif}main{width:min(100%,470px);border:1px solid #20633d;border-radius:18px;background:#081e11;padding:24px}h1{font-size:1.25rem}p{color:#afd0b9;line-height:1.5}a{color:#6df59c}</style>
</head><body><main aria-live="polite"><small>QwerNFC</small><h1 id="title">Opening your permanent QR/NFC</h1><p id="status">Checking the current QwerNFC destination…</p><p><a id="continue" hidden rel="noreferrer noopener">Continue</a></p></main>
<script>
(async()=>{
  const recoveryMatch=location.pathname.match(/^\/permanent-qr-manager\/recover\/(QR-\d{3,})\/?(?:index\.html)?$/i);
  if(recoveryMatch){
    const id=recoveryMatch[1].toUpperCase();
    const target=new URL("https://thenfcguy.github.io/permanent-qr-manager/recover/"+encodeURIComponent(id)+"/");
    target.searchParams.set("v",Date.now().toString());
    location.replace(target.href);
    return;
  }
  const match=location.pathname.match(/\/permanent-qr-manager\/(go|nfc)\/(QR-\d{3,})\/?(?:index\.html)?$/i);
  const title=document.getElementById("title"),status=document.getElementById("status"),link=document.getElementById("continue");
  const show=(heading,description)=>{title.textContent=heading;status.textContent=description};
  if(!match){show("Invalid permanent route","This URL does not identify a QwerNFC QR/NFC.");return}
  const kind=match[1].toLowerCase(),id=match[2].toUpperCase();
  const resolver="https://qwernfc-api.qwernfc-api.workers.dev/"+kind+"/"+id+"/";
  const path="permanent-qr-manager/"+kind+"/"+id+"/";
  const fresh=src=>src+(src.includes("?")?"&":"?")+"t="+Date.now();
  const fetchTimed=async(src)=>{
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),3000);
    try{return await fetch(fresh(src),{cache:"no-store",mode:"cors",signal:controller.signal})}
    finally{clearTimeout(timer)}
  };
  const decode=async(response,api)=>{
    if(!response.ok)throw Error("Unavailable");
    const data=await response.json();
    if(!api)return data;
    if(typeof data.content!=="string")throw Error("Invalid route");
    const bytes=Uint8Array.from(atob(data.content.replace(/\s/g,"")),ch=>ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  };
  const read=async file=>{
    const api="https://api.github.com/repos/TheNFCGuy/TheNFCGuy.github.io/contents/"+path+file+"?ref=main";
    const raw="https://raw.githubusercontent.com/TheNFCGuy/TheNFCGuy.github.io/main/"+path+file;
    const settled=await Promise.allSettled([fetchTimed(api).then(r=>decode(r,true)),fetchTimed(raw).then(r=>decode(r,false))]);
    const records=settled.filter(x=>x.status==="fulfilled").map(x=>x.value).filter(x=>x&&x.id===id&&x.deleted!==true&&x.enabled===true);
    records.sort((a,b)=>Number(b.linkVersion||0)-Number(a.linkVersion||0)||String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
    return records[0]||null;
  };
  const backup=async()=>{
    let record=await read("route.json"),backupMode=false;
    if(!record){record=await read("fallback.json");backupMode=true}
    if(!record){show("Route unavailable","The QwerNFC destination could not be verified. Please try again shortly.");return}
    const value=String(backupMode?record.fallbackDestination:record.destination||"").trim();
    if(!value){show("Destination not configured","The QwerNFC owner has not configured this destination.");return}
    try{
      const target=new URL(value);
      if(!["https:","http:"].includes(target.protocol)||target.username||target.password||(target.origin===location.origin&&target.pathname===location.pathname))throw Error("Invalid destination");
      link.href=target.href;link.hidden=false;location.replace(target.href);
    }catch{show("Invalid destination","The saved QwerNFC destination is invalid.")}
  };
  try{
    const reply=await fetchTimed(resolver+"?probe=1");
    if(reply.status===204&&reply.headers.get("x-qwernfc-resolver")==="ready"){
      location.replace(fresh(resolver));return;
    }
  }catch{}
  await backup();
})();
</script></body></html>
