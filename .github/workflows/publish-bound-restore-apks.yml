name: Publish Bound QwerNFC Restore APKs

on:
  push:
    branches: [bbmain]
    paths:
      - ".github/workflows/publish-bound-restore-apks.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbmain

      - name: Download exact per-QR Restore artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b4ec-8211-a0e7-0c4cd9e0826d/raw?se=2026-09-25T07%3A25%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=d8c9e7a8-3288-577e-b24d-9f1a68b8ff7d&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T07%3A19%3A13Z&ske=2026-09-26T07%3A19%3A13Z&sks=b&skv=2026-02-06&sig=kAZA%2BQz5So2NifWvCPxBdKriWy9m6mdC7F4OxARID90%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/restore-bound.zip
          rm -rf /tmp/restore-bound
          mkdir -p /tmp/restore-bound
          unzip -q /tmp/restore-bound.zip -d /tmp/restore-bound

          grep -F "Commit: c504ce08085c0423821b40829c410cacfa33808d" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr002" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Restore-ID: QR-002" /tmp/restore-bound/QR-002/BUILD.txt
          echo "2e8afafcb82aae8b5664b2e040bf9f71283dfc9fad51e31755e0451e087527cf  /tmp/restore-bound/QR-002/QwerNFC-Restore-QR-002.apk" | sha256sum -c -

          grep -F "Commit: c504ce08085c0423821b40829c410cacfa33808d" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr003" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Restore-ID: QR-003" /tmp/restore-bound/QR-003/BUILD.txt
          echo "d2b520a7882e3c9bae641b831abbb7c31662dda2da4a9aa530a6d846a8c0e31e  /tmp/restore-bound/QR-003/QwerNFC-Restore-QR-003.apk" | sha256sum -c -

          for id in QR-002 QR-003; do
            mkdir -p "permanent-qr-manager/downloads/restore/$id"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk"
            cp "/tmp/restore-bound/$id/BUILD.txt" "permanent-qr-manager/downloads/restore/$id/BUILD.txt"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk.sha256" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk.sha256"
          done

      - name: Publish exact Restore APKs
        run: |
          set -euo pipefail
          git config user.name "QwerNFC Restore Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add permanent-qr-manager/downloads/restore
          if git diff --cached --quiet; then
            echo "Restore APKs already current."
            exit 0
          fi
          git commit -m "feat: publish redesigned QR-specific Restore APKs c504ce08 [skip ci]"
          git push origin HEAD:bbmain
