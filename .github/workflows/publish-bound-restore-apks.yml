name: Publish Bound QwerNFC Restore APKs

on:
  push:
    branches: [bbmain]
    paths:
      - ".github/workflows/publish-bound-restore-apks.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbmain

      - name: Download verified per-QR Restore artifacts
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4e70-8211-ba5c-acc03d9e9ed1/raw?se=2026-09-25T04%3A50%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=ea58bddb-bbcf-54b2-8df1-59b3b7f4274e&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T04%3A01%3A10Z&ske=2026-09-26T04%3A01%3A10Z&sks=b&skv=2026-02-06&sig=YUXz/aN7JxfUyF3B4KCttIAs4UZMyz/%2Bgam12rZY0jw%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/restore-bound.zip
          rm -rf /tmp/restore-bound
          mkdir -p /tmp/restore-bound
          unzip -q /tmp/restore-bound.zip -d /tmp/restore-bound

          grep -F "Commit: b6be66f961dc8265e8e4dcd201406d23232483ee" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr002" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Restore-ID: QR-002" /tmp/restore-bound/QR-002/BUILD.txt
          echo "cef3b5cf15dd6bdadb44f387b01b5d56e6a19ae1c0d132ae404640691fb32d36  /tmp/restore-bound/QR-002/QwerNFC-Restore-QR-002.apk" | sha256sum -c -

          grep -F "Commit: b6be66f961dc8265e8e4dcd201406d23232483ee" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr003" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Restore-ID: QR-003" /tmp/restore-bound/QR-003/BUILD.txt
          echo "b050db2dfae3b31dac318ce6dc79199b87e77ca06895d62d05bab235a8173718  /tmp/restore-bound/QR-003/QwerNFC-Restore-QR-003.apk" | sha256sum -c -

          for id in QR-002 QR-003; do
            mkdir -p "permanent-qr-manager/downloads/restore/$id"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk"
            cp "/tmp/restore-bound/$id/BUILD.txt" "permanent-qr-manager/downloads/restore/$id/BUILD.txt"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk.sha256" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk.sha256"
          done

      - name: Publish bound Restore APKs to Pages
        run: |
          set -euo pipefail
          git config user.name "QwerNFC Restore Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add permanent-qr-manager/downloads/restore
          if git diff --cached --quiet; then
            echo "Bound Restore APKs already published."
            exit 0
          fi
          git commit -m "feat: publish QR-specific QwerNFC Restore APKs b6be66f9 [skip ci]"
          git push origin HEAD:bbmain
