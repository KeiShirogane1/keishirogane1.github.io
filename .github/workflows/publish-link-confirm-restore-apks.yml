name: Publish Link Confirmation Restore APKs

on:
  push:
    branches: [bbmain]
    paths:
      - ".github/workflows/publish-link-confirm-restore-apks.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbmain

      - name: Download exact per-QR Restore artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-f5ec-8211-ad88-7200c28f60e5/raw?se=2026-09-25T09%3A42%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=329eb67a-d211-5246-b8af-c6840b28089d&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T06%3A09%3A22Z&ske=2026-09-26T06%3A09%3A22Z&sks=b&skv=2026-02-06&sig=nBN/5d7nhhJYWnr6gQ00OIE8u66IQMGYM7cP5lvb8KI%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/restore-bound.zip
          rm -rf /tmp/restore-bound
          mkdir -p /tmp/restore-bound
          unzip -q /tmp/restore-bound.zip -d /tmp/restore-bound

          grep -F "Commit: 11303d380041fb9cf4df1dcb57863a8c871a5c95" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr002" /tmp/restore-bound/QR-002/BUILD.txt
          grep -F "Restore-ID: QR-002" /tmp/restore-bound/QR-002/BUILD.txt
          echo "b650aa799d209cc025b6dfb2295b777cf77e6152aa95a5a2e3e8604f3902f499  /tmp/restore-bound/QR-002/QwerNFC-Restore-QR-002.apk" | sha256sum -c -

          grep -F "Commit: 11303d380041fb9cf4df1dcb57863a8c871a5c95" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore.qr003" /tmp/restore-bound/QR-003/BUILD.txt
          grep -F "Restore-ID: QR-003" /tmp/restore-bound/QR-003/BUILD.txt
          echo "da8d5da330412175de72dda129c618a1591ef4c060b210d0de42f29a0c6470f1  /tmp/restore-bound/QR-003/QwerNFC-Restore-QR-003.apk" | sha256sum -c -

          for id in QR-002 QR-003; do
            mkdir -p "permanent-qr-manager/downloads/restore/$id"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk"
            cp "/tmp/restore-bound/$id/BUILD.txt" "permanent-qr-manager/downloads/restore/$id/BUILD.txt"
            cp "/tmp/restore-bound/$id/QwerNFC-Restore-$id.apk.sha256" "permanent-qr-manager/downloads/restore/$id/QwerNFC-Restore-$id.apk.sha256"
          done

      - name: Publish exact Restore APKs
        run: |
          set -euo pipefail
          git config user.name "QwerNFC Restore Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add permanent-qr-manager/downloads/restore
          if git diff --cached --quiet; then
            echo "Restore APKs already current."
            exit 0
          fi
          git commit -m "feat: publish customer link-confirmation Restore APKs 11303d38 [skip ci]"
          git push origin HEAD:bbmain
