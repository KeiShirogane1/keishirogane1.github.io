name: Publish QwerNFC Restore APK

on:
  push:
    branches:
      - bbmain
    paths:
      - ".github/workflows/publish-qwernfc-restore.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbmain

      - name: Download verified Restore APK artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-31c4-8211-9f7a-985e90736377/raw?se=2026-09-25T02%3A51%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=4ffb050c-ddd3-5ac8-b7e2-c36643d3ff09&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T01%3A44%3A05Z&ske=2026-09-26T01%3A44%3A05Z&sks=b&skv=2026-02-06&sig=wE23/b9DQ861JScasn9McwIY2kOLhEqh4xsmiHiiAFo%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/qwernfc-restore.zip
          rm -rf /tmp/qwernfc-restore
          mkdir -p /tmp/qwernfc-restore
          unzip -q /tmp/qwernfc-restore.zip -d /tmp/qwernfc-restore
          grep -F "Commit: f453e1d7a6d09c2961a3fbbb1ad518b42d78096c" /tmp/qwernfc-restore/BUILD.txt
          echo "b0615726b81a7892b6c5de9097cdf09af0c1aa1b4dd518315236f000f87f0b8b  /tmp/qwernfc-restore/QwerNFC-debug.apk" | sha256sum -c -
          mkdir -p permanent-qr-manager/downloads
          cp /tmp/qwernfc-restore/QwerNFC-debug.apk permanent-qr-manager/downloads/QwerNFC-Restore.apk
          cp /tmp/qwernfc-restore/BUILD.txt permanent-qr-manager/downloads/QwerNFC-Restore-BUILD.txt
          printf '%s  %s\n' "b0615726b81a7892b6c5de9097cdf09af0c1aa1b4dd518315236f000f87f0b8b" "QwerNFC-Restore.apk" > permanent-qr-manager/downloads/QwerNFC-Restore.apk.sha256

      - name: Publish download to Pages branch
        run: |
          set -euo pipefail
          git config user.name "QwerNFC Restore Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add permanent-qr-manager/downloads/QwerNFC-Restore.apk permanent-qr-manager/downloads/QwerNFC-Restore-BUILD.txt permanent-qr-manager/downloads/QwerNFC-Restore.apk.sha256
          if git diff --cached --quiet; then
            echo "Restore APK already published."
            exit 0
          fi
          git commit -m "feat: publish QwerNFC Restore APK f453e1d7 [skip ci]"
          git push origin HEAD:bbmain
