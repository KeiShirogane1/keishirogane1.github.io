name: Publish QwerNFC Restore APK

on:
  push:
    branches:
      - bbmain
    paths:
      - ".github/workflows/publish-qwernfc-restore.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbmain

      - name: Download verified customer Restore artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-1348-8211-adf3-af5f8ff8e71c/raw?se=2026-09-25T04%3A05%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=1bedb0f6-8ed2-54c4-b9c7-7d9a24788b44&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T02%3A56%3A57Z&ske=2026-09-26T02%3A56%3A57Z&sks=b&skv=2026-02-06&sig=NPnSFH954MwC8GpvBJYFi9v0xIrzPfmRJ44q/bMv3EA%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o /tmp/qwernfc-restore.zip
          rm -rf /tmp/qwernfc-restore
          mkdir -p /tmp/qwernfc-restore
          unzip -q /tmp/qwernfc-restore.zip -d /tmp/qwernfc-restore
          grep -F "Commit: 27a08a542913bf69ff977671b654699b6dc7d463" /tmp/qwernfc-restore/BUILD.txt
          grep -F "Package: com.keishirogane.qwernfcrestore" /tmp/qwernfc-restore/BUILD.txt
          echo "1a0fa57e239564edba8e37c4a4ed0c355b506ebe4297b1cc0cc2fbaa01110fcb  /tmp/qwernfc-restore/QwerNFC-Restore-debug.apk" | sha256sum -c -
          mkdir -p permanent-qr-manager/downloads
          cp /tmp/qwernfc-restore/QwerNFC-Restore-debug.apk permanent-qr-manager/downloads/QwerNFC-Restore.apk
          cp /tmp/qwernfc-restore/BUILD.txt permanent-qr-manager/downloads/QwerNFC-Restore-BUILD.txt
          printf '%s  %s\n' "1a0fa57e239564edba8e37c4a4ed0c355b506ebe4297b1cc0cc2fbaa01110fcb" "QwerNFC-Restore.apk" > permanent-qr-manager/downloads/QwerNFC-Restore.apk.sha256

      - name: Publish Restore APK to Pages
        run: |
          set -euo pipefail
          git config user.name "QwerNFC Restore Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add permanent-qr-manager/downloads/QwerNFC-Restore.apk permanent-qr-manager/downloads/QwerNFC-Restore-BUILD.txt permanent-qr-manager/downloads/QwerNFC-Restore.apk.sha256
          if git diff --cached --quiet; then
            echo "Restore APK already published."
            exit 0
          fi
          git commit -m "feat: publish customer QwerNFC Restore APK 27a08a54 [skip ci]"
          git push origin HEAD:bbmain
